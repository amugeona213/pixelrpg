<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 휴대폰: 화면 꽉 채우기(노치 포함), 확대 막기 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07060b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="전사·마법사·궁수로 밤의 숲을 지나는 2D 횡스크롤 액션 RPG">
  <!-- 홈 화면에 추가 (안드로이드·아이폰·아이패드) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="픽셀 원정대">
  <title>픽셀 원정대</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="픽셀 원정대 게임 화면"></canvas>
  <div id="touch" aria-label="터치 조작"></div>
  <div id="rotate" role="alert">
    <div class="phone" aria-hidden="true"></div>
    <p>화면을 <b>가로로</b> 돌려 주세요</p>
  </div>
  <noscript>이 게임은 자바스크립트가 필요해요.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
